name: Protect Application and Location Tracking

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  protected-features:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify protected tracking features
        run: npm run verify-tracking-features

      - name: Typecheck and build
        run: npm run build
