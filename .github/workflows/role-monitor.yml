name: Aerospace Role Discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/*.mjs'
      - '.github/workflows/role-monitor.yml'
  schedule:
    # 09:15 and 17:00 UK time. GitHub cron is UTC, so these are
    # 09:15/17:00 UTC in winter and 08:15/16:00 UTC in summer.
    - cron: '15 9 * * *'
    - cron: '0 17 * * *'

permissions:
  contents: read

jobs:
  discover-and-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate automation scripts
        run: |
          node --check scripts/job-discovery.mjs
          node --check scripts/gradcracker-discovery.mjs
          node --check scripts/role-monitor.mjs
          node --check scripts/reliable-role-verification.mjs
          node --check scripts/ai-role-status.mjs

      - name: Discover new aerospace roles
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/job-discovery.mjs

      - name: Discover Gradcracker placements
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/gradcracker-discovery.mjs

      - name: Verify tracked role links
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/role-monitor.mjs

      - name: AI research tracked role application status
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
        run: node scripts/ai-role-status.mjs
