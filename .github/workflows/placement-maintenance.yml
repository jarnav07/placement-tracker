name: Placement Maintenance

on:
  schedule:
    # 09:30 and 18:00 UK time. GitHub cron is UTC and ignores UK daylight saving,
    # so these are 08:30/17:00 UTC during British Summer Time (Mar-Oct);
    # in winter (GMT) they will run one hour earlier in UK local time.
    - cron: '30 8 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: placement-maintenance
  # Never cancel a run in progress: an interrupted audit must not leave a half-updated board.
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Discover new 2027 placements
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          USE_OPENAI: ${{ vars.USE_OPENAI }}
          USE_GROQ: ${{ vars.USE_GROQ }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
        run: npm run discover

      - name: Audit every placement
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          USE_OPENAI: ${{ vars.USE_OPENAI }}
          USE_GROQ: ${{ vars.USE_GROQ || 'true' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
        run: npm run audit
